 <!DOCTYPE html>
<html lang="en" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytical - Group 3 Project</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- مكتبة الزينة (Confetti) -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        /* الألوان */
        :root {
            --blue-primary: #1e60d2;   
            --blue-dark: #0f172a;      
            --blue-light: #eef4ff;     
            --white: #ffffff;
            --gray-bg: #f8fafc;
            --gray-border: #e2e8f0;
            --text-muted: #64748b;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            --danger: #ef4444;
            --success: #10b981;
            --warning: #f59e0b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        
        body {
            background: linear-gradient(180deg, #f0f5ff 0%, #f8fafc 100%);
            color: var(--blue-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 70px; 
        }

        /* الشريط العلوي */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: var(--white);
            height: 70px;
            padding: 0 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 15px rgba(0,0,0,0.05);
            z-index: 1000;
        }
        
        .logo {
            font-size: 24px; font-weight: 800; color: var(--blue-dark);
            display: flex; align-items: center; gap: 12px;
        }
        .logo-icon {
            background: linear-gradient(135deg, var(--blue-primary), #154a9e); 
            color: var(--white); width: 40px; height: 40px; border-radius: 10px;
            display: flex; justify-content: center; align-items: center; font-size: 18px;
            box-shadow: 0 4px 10px rgba(30, 96, 210, 0.3);
        }

        .nav-actions { display: flex; gap: 10px; align-items: center; }
        
        .action-icon-btn {
            background: var(--white); color: var(--text-muted);
            border: 1px solid var(--gray-border); height: 40px; padding: 0 15px;
            border-radius: 10px; display: flex; justify-content: center; align-items: center;
            gap: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: 0.3s;
        }
        .action-icon-btn:hover { background: var(--blue-light); color: var(--blue-primary); border-color: var(--blue-primary); }
        .quiz-btn { color: var(--warning); border-color: #fcd34d; background: #fffbeb;}
        .quiz-btn:hover { background: var(--warning); color: var(--white); border-color: var(--warning); }
        
        .fullscreen-btn { color: var(--blue-primary); border-color: var(--blue-primary); background: var(--blue-light); }
        .fullscreen-btn:hover { background: var(--blue-primary); color: var(--white); }

        /* شريط أزرار الطلاب */
        .students-nav-container {
            width: 100%; max-width: 1200px; background: transparent;
            padding: 15px 20px; display: flex; overflow-x: auto; gap: 15px;
            scrollbar-width: none; 
        }
        .students-nav-container::-webkit-scrollbar { display: none; }

        .student-btn {
            padding: 10px 24px; border-radius: 50px; border: 1px solid var(--gray-border);
            background: var(--white); color: var(--text-muted); font-weight: 700; font-size: 18px;
            cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 10px; 
            white-space: nowrap; box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }
        .student-btn:hover { background: var(--blue-light); border-color: var(--blue-primary); color: var(--blue-primary); transform: translateY(-2px);}
        .student-btn.active { background: var(--blue-primary); color: var(--white); border-color: var(--blue-primary); box-shadow: 0 4px 15px rgba(30, 96, 210, 0.3); }

        /* منطقة المحتوى الرئيسية */
        .main-content {
            width: 100%; max-width: 1000px;
            padding: 20px; display: flex; flex-direction: column; align-items: center;
        }

        /* شاشة الترحيب */
        .hero-section { text-align: center; margin-top: 5vh; display: block; }
        .hero-section h1 { font-size: 42px; font-weight: 800; margin-bottom: 15px; }
        .hero-section h1 span { color: var(--blue-primary); }
        .hero-section p { font-size: 18px; color: var(--text-muted); font-weight: 500;}

        /* كارت عرض السلايد */
        .dashboard-card {
            background: var(--white); width: 100%; border-radius: 20px;
            box-shadow: var(--shadow); border: 1px solid var(--gray-border);
            display: none; overflow: hidden; animation: fadeIn 0.3s ease-out;
            padding: 30px; 
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .slide-content { text-align: center; }
        
        /* تصميم حاوية الوسائط (صورة أو فيديو) */
        .slide-media-container {
            margin-bottom: 20px; display: flex; justify-content: center; align-items: center;
            width: 100%; position: relative; cursor: zoom-in; 
        }

        .slide-media-container img {
            width: 100%; max-height: 65vh; border-radius: 16px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            object-fit: contain; background-color: var(--gray-bg); 
        }
        
        .slide-media-container video {
            width: 100%; max-height: 65vh; border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            outline: none; background-color: #000; cursor: default; 
        }

        .student-main-name {
            font-size: 45px; font-weight: 800; color: var(--blue-dark);
            margin-bottom: 10px; line-height: 1.2; text-transform: capitalize;
        }

        .student-group-tag {
            display: inline-block; background: var(--blue-light); color: var(--blue-primary);
            padding: 8px 25px; border-radius: 30px; font-size: 18px; font-weight: 800; letter-spacing: 1px;
        }

        /* شاشة عرض الصورة كاملة */
        .fullscreen-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.95); display: none; justify-content: center; align-items: center;
            z-index: 99999; cursor: zoom-out;
        }
        .fullscreen-overlay.active { display: flex; animation: fadeIn 0.3s ease-out; }
        .fullscreen-overlay img { max-width: 95%; max-height: 95%; object-fit: contain; border-radius: 8px; }
        .close-fullscreen {
            position: absolute; top: 20px; right: 30px; color: var(--white); font-size: 40px; font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        .close-fullscreen:hover { color: var(--danger); transform: scale(1.1); }

        /* ========================================== */
        /* شاشة اللعبة (Quiz) */
        /* ========================================== */
        .quiz-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(135deg, #f0f5ff 0%, #ffffff 100%);
            z-index: 9999; display: none; flex-direction: column; padding: 20px 40px; overflow: hidden; 
        }
        .quiz-overlay.active { display: flex; animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

        .quiz-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .quiz-header h2 { font-size: 28px; font-weight: 800; color: var(--blue-dark); }
        .exit-btn {
            background: var(--danger); color: var(--white); border: none;
            padding: 10px 20px; border-radius: 10px; font-size: 16px; font-weight: 700;
            cursor: pointer; transition: 0.3s; display: flex; align-items: center; gap: 8px;
        }
        .exit-btn:hover { background: #b91c1c; transform: translateY(-2px); }

        .scoreboard { display: flex; justify-content: center; gap: 50px; margin-bottom: 25px; flex-shrink: 0; }
        
        .team-score {
            width: 180px; height: 180px; background: var(--white); border-radius: 20px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            border: 3px solid var(--gray-border); transition: 0.3s ease-in-out; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); position: relative;
        }
        .team-score.active-team {
            border-color: var(--blue-primary); background: var(--blue-light);
            transform: scale(1.1); box-shadow: 0 0 0 6px rgba(30, 96, 210, 0.2), 0 10px 25px rgba(30, 96, 210, 0.4);
            animation: pulse-blue 1.5s infinite;
        }
        @keyframes pulse-blue {
            0% { box-shadow: 0 0 0 0 rgba(30, 96, 210, 0.5), 0 10px 25px rgba(30, 96, 210, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(30, 96, 210, 0), 0 10px 25px rgba(30, 96, 210, 0.4); }
            100% { box-shadow: 0 0 0 0 rgba(30, 96, 210, 0), 0 10px 25px rgba(30, 96, 210, 0.4); }
        }
        .turn-badge {
            position: absolute; top: -15px; background: var(--blue-primary); color: var(--white);
            padding: 4px 15px; border-radius: 20px; font-size: 14px; font-weight: 800;
            text-transform: uppercase; letter-spacing: 1px; opacity: 0; transform: translateY(10px);
            transition: 0.3s; box-shadow: 0 4px 10px rgba(30, 96, 210, 0.3);
        }
        .team-score.active-team .turn-badge { opacity: 1; transform: translateY(0); }
        
        .team-score h3 { font-size: 26px; margin-bottom: 5px; color: var(--text-muted); font-weight: 700; transition: 0.3s; }
        .team-score.active-team h3 { color: var(--blue-primary); font-weight: 800; }
        .team-score .score { font-size: 60px; font-weight: 800; color: var(--blue-dark); line-height: 1; }
        .team-score.active-team .score { color: var(--blue-primary); }

        .quiz-card {
            background: var(--white); border-radius: 20px; padding: 30px;
            box-shadow: var(--shadow); border: 1px solid var(--gray-border);
            flex: 1; display: flex; flex-direction: column; justify-content: center; text-align: center;
        }
        
        /* تصغير حجم خط السؤال شوية عشان الأسئلة الطويلة تبان كويسة */
        .question-text { font-size: 26px; font-weight: 700; color: var(--blue-dark); margin-bottom: 25px; direction: ltr; line-height: 1.4; }
        
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .option-btn {
            background: var(--gray-bg); border: 2px solid var(--gray-border);
            padding: 15px 20px; border-radius: 16px; font-size: 18px; font-weight: 600;
            color: var(--blue-dark); cursor: pointer; transition: 0.2s;
            display: flex; align-items: center; justify-content: space-between; direction: ltr; 
            text-align: left;
        }
        .option-content { display: flex; align-items: center; gap: 15px; }
        .option-btn .letter {
            background: var(--white); width: 35px; height: 35px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            font-size: 16px; color: var(--text-muted); border: 1px solid var(--gray-border); flex-shrink: 0;
        }
        .status-icon { display: none; font-size: 24px; }
        
        /* شكل الزرار العادي */
        .option-btn:hover:not(.correct):not(.wrong) { border-color: var(--blue-primary); background: var(--blue-light); transform: translateY(-3px); }
        .option-btn:hover:not(.correct):not(.wrong) .letter { background: var(--blue-primary); color: var(--white); }
        
        /* الإجابة الصحيحة */
        .option-btn.correct { background: #ecfdf5; border-color: var(--success); color: var(--success); pointer-events: none; }
        .option-btn.correct .letter { background: var(--success); color: var(--white); }
        .option-btn.correct .check-icon { display: block; color: var(--success); }
        
        /* الإجابة الغلط */
        .option-btn.wrong { background: #fef2f2; border-color: var(--danger); color: var(--danger); pointer-events: none; animation: shake 0.4s ease; }
        .option-btn.wrong .letter { background: var(--danger); color: var(--white); }
        .option-btn.wrong .cross-icon { display: block; color: var(--danger); }
        
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

        /* تعطيل باقي الأزرار لما نجيب صح */
        .option-btn.disabled { pointer-events: none; opacity: 0.7; }

        .feedback-text { font-size: 20px; font-weight: 700; height: 30px; margin-bottom: 15px; opacity: 0; transition: 0.3s; }
        .feedback-text.show { opacity: 1; animation: pop 0.4s ease; }
        @keyframes pop { 0% { transform: scale(0.8); } 100% { transform: scale(1); } }

        .next-btn {
            background: var(--blue-primary); color: var(--white); border: none;
            padding: 15px 50px; border-radius: 12px; font-size: 20px; font-weight: 700;
            cursor: pointer; transition: 0.3s; display: none; align-self: center;
        }
        .next-btn:hover { background: #154a9e; transform: scale(1.05); }

        /* الموبايل */
        @media (max-width: 768px) {
            .navbar { padding: 0 15px; }
            .logo { font-size: 20px; }
            .logo-icon { width: 35px; height: 35px; font-size: 16px; }
            .action-icon-btn .btn-text { display: none; }
            .action-icon-btn { padding: 0 12px; }
            .dashboard-card { padding: 15px; }
            .student-main-name { font-size: 30px; } 
            .slide-media-container img, .slide-media-container video { max-height: 55vh; }
            .quiz-overlay { padding: 15px; overflow-y: auto; } /* السماح بالسكرول لو الشاشة صغيرة */
            .quiz-header h2 { font-size: 20px; }
            
            .scoreboard { gap: 15px; margin-bottom: 15px;}
            .team-score { width: 110px; height: 110px; }
            .team-score .score { font-size: 32px; }
            .team-score h3 { font-size: 16px; }
            
            .question-text { font-size: 18px; margin-bottom: 15px; }
            .options-grid { grid-template-columns: 1fr; gap: 10px; }
            .option-btn { padding: 12px; font-size: 15px; }
            .option-btn .letter { width: 28px; height: 28px; font-size: 12px; }
            .next-btn { padding: 12px 30px; font-size: 16px; }
            .hero-section h1 { font-size: 32px; }
            .student-btn { font-size: 15px; padding: 8px 16px; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo">
            <div class="logo-icon"><i class="fa-solid fa-heart-pulse"></i></div>
            Analytical
        </div>
        <div class="nav-actions">
            <button class="action-icon-btn fullscreen-btn" onclick="toggleFullscreen()" title="Fullscreen">
                <i class="fa-solid fa-expand"></i>
            </button>
            <button class="action-icon-btn quiz-btn" onclick="openQuiz()">
                <i class="fa-solid fa-gamepad"></i> <span class="btn-text">Quiz Game</span>
            </button>
            <button class="action-icon-btn" onclick="openSettings()" title="Settings">
                <i class="fa-solid fa-gear"></i>
            </button>
        </div>
    </nav>

    <div class="students-nav-container" id="students-nav"></div>

    <main class="main-content">
        
        <div class="hero-section" id="hero-section">
            <h1>Medical Data <span>Analytics</span></h1>
            <p>Group 3 - Second Year Project Presentation</p>
        </div>

        <div class="dashboard-card" id="dashboard-card">
            <div class="slide-content">
                <div class="slide-media-container" id="slide-media-container">
                    <!-- سيتم حقن الصورة أو الفيديو هنا عبر الجافاسكريبت -->
                </div>
                <h1 class="student-main-name" id="display-student-name">Student Name</h1>
                <div class="student-group-tag">Group 3</div>
            </div>
        </div>

    </main>

    <!-- شاشة عرض الصورة كاملة -->
    <div class="fullscreen-overlay" id="fullscreen-overlay" onclick="closeFullscreen()">
        <span class="close-fullscreen">&times;</span>
        <img id="fullscreen-img" src="" alt="Fullscreen Image">
    </div>

    <!-- شاشة اللعبة (Quiz) -->
    <div class="quiz-overlay" id="quiz-overlay">
        <div class="quiz-header">
            <h2><i class="fa-solid fa-gamepad" style="color: var(--warning);"></i> Quiz Challenge</h2>
            <button class="exit-btn" onclick="closeQuiz()"><i class="fa-solid fa-right-from-bracket"></i> Exit</button>
        </div>
        <div class="scoreboard">
            <div class="team-score" id="team1-card">
                <div class="turn-badge">Turn</div>
                <h3>Group 1</h3>
                <div class="score" id="team1-score">0</div>
            </div>
            <div class="team-score" id="team2-card">
                <div class="turn-badge">Turn</div>
                <h3>Group 2</h3>
                <div class="score" id="team2-score">0</div>
            </div>
        </div>
        <div class="quiz-card">
            <div class="question-text" id="question-text">Question will appear here...</div>
            <div class="options-grid" id="options-container"></div>
            <div class="feedback-text" id="feedback-text"></div>
            <button class="next-btn" id="next-btn" onclick="nextQuestion()">Next Question <i class="fa-solid fa-arrow-left"></i></button>
        </div>
    </div>

    <!-- نافذة الإعدادات -->
    <div id="settings-modal" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6); display: none; justify-content: center; align-items: center; z-index: 1000;">
        <div style="background: var(--white); width: 90%; max-width: 500px; border-radius: 16px; padding: 25px;">
            <div style="display: flex; justify-content: space-between; margin-bottom: 20px;">
                <h2 style="font-size: 22px; color: var(--blue-dark);"><i class="fa-solid fa-gear"></i> Manage Students</h2>
                <button onclick="closeSettings()" style="background: none; border: none; font-size: 20px; cursor: pointer;"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="settings-list" style="max-height: 400px; overflow-y: auto;"></div>
        </div>
    </div>

    <script>
        // البيانات: تم تغيير الطالب رقم 9 إلى فيديو
        let studentsData = [
            { id: 1, name: "Sondos Mohamed", mediaUrl: "images/1.jpg", type: "image" },
            { id: 2, name: "Dina Yasser", mediaUrl: "images/2.jpg", type: "image" },
            { id: 3, name: "Yasmin Hani", mediaUrl: "images/3.jpg", type: "image" },
            { id: 4, name: "Maryam Mohamed", mediaUrl: "images/4.jpg", type: "image" },
            { id: 5, name: "Abdallah Mahmoud", mediaUrl: "images/5.jpg", type: "image" },
            { id: 6, name: "Shaza Ahmed", mediaUrl: "images/6.jpg", type: "image" },
            { id: 7, name: "Renad Ashraf", mediaUrl: "images/7.jpg", type: "image" },
            { id: 8, name: "Yasmin Ashraf", mediaUrl: "images/8.jpg", type: "image" },
            { id: 9, name: "Rawan Mostafa", mediaUrl: "images/9.mp4", type: "video" }
        ];

        // الأسئلة الجديدة (من الصور)
        const quizData = [
            { 
                question: "Q1. In which type of flame are the fuel and the oxidant mixed in the flame itself?", 
                options: ["Premix (laminar) flame", "Un-premix (turbulent) flame", "Flame with a mixing chamber", "Laminar flame with a chopper"], 
                correctAnswer: 1 
            },
            { 
                question: "Q2. According to the principle of AAS, what happens when atoms are exposed to light of a certain wavelength?", 
                options: ["Electrons emit light and fall to lower energy levels", "Atoms are converted into molecules", "Electrons absorb light and jump from low energy levels to high ones", "The atoms are removed from the flame"], 
                correctAnswer: 2 
            },
            { 
                question: "Q3. What is the function of the monochromator in AAS?", 
                options: ["Select a given emission line and isolate it from other lines", "Convert the sample into free atoms", "Eliminate the effect of flame emission", "Display the absorption reading"], 
                correctAnswer: 0 
            },
            { 
                question: "Q4. Which statement about the sensitivity of AAS is correct?", 
                options: ["AAS is less sensitive than flame emission", "AAS and flame emission have the same sensitivity", "Sensitivity of AAS decreases when a laser is used", "AAS is about 100-fold more sensitive than flame emission"], 
                correctAnswer: 3 
            },
            { 
                question: "Q5. Why is a different hollow cathode lamp needed for each element?", 
                options: ["Because the lamp is made of the element to be measured, so it gives the same wavelength", "Because each element needs a different inert gas", "Because each element needs a different quartz window", "Because each element has a different burner"], 
                correctAnswer: 0 
            },
            { 
                question: "Q6. Why must the effect of flame emission be eliminated in the detector?", 
                options: ["Because it increases the lamp intensity", "Because we need the signal intensity due to absorption only", "Because it removes the inert gas from the lamp", "Because it changes the wavelength of the monochromator"], 
                correctAnswer: 1 
            }
        ];

        let currentQuestionIndex = 0;
        let currentTeam = 1; 
        let team1Score = 0;
        let team2Score = 0;
        let isAnsweredCorrectly = false; // متغير جديد عشان نعرف هل السؤال ده اتجاوب صح ولا لأ

        // الشاشة الكاملة
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
                document.querySelector('.fullscreen-btn i').classList.remove('fa-expand');
                document.querySelector('.fullscreen-btn i').classList.add('fa-compress');
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                    document.querySelector('.fullscreen-btn i').classList.remove('fa-compress');
                    document.querySelector('.fullscreen-btn i').classList.add('fa-expand');
                }
            }
        }

        function renderNav() {
            const navContainer = document.getElementById('students-nav');
            navContainer.innerHTML = ''; 
            studentsData.forEach((student, index) => {
                const btn = document.createElement('button');
                btn.className = 'student-btn';
                btn.id = `btn-${student.id}`;
                btn.innerHTML = `<i class="fa-solid fa-user-graduate"></i> ${index + 1}. ${student.name.split(' ')[0]}`;
                btn.onclick = () => loadStudent(student.id);
                navContainer.appendChild(btn);
            });
        }

        function loadStudent(id) {
            document.getElementById('hero-section').style.display = 'none';
            document.getElementById('dashboard-card').style.display = 'block';
            document.querySelectorAll('.student-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${id}`).classList.add('active');

            const student = studentsData.find(s => s.id === id);
            document.getElementById('display-student-name').innerText = student.name;

            const mediaContainer = document.getElementById('slide-media-container');
            mediaContainer.innerHTML = ''; 

            if (student.mediaUrl && student.mediaUrl.trim() !== "") {
                mediaContainer.style.display = 'flex'; 
                if (student.type === 'video') {
                    mediaContainer.style.cursor = 'default'; 
                    mediaContainer.onclick = null;
                    mediaContainer.innerHTML = `<video controls autoplay><source src="${student.mediaUrl}" type="video/mp4"></video>`;
                } else {
                    mediaContainer.style.cursor = 'zoom-in';
                    mediaContainer.onclick = openFullscreen; 
                    mediaContainer.innerHTML = `<img id="slide-image" src="${student.mediaUrl}" alt="${student.name}">`;
                }
            } else {
                mediaContainer.style.display = 'none'; 
            }
        }

        function openFullscreen() {
            const mainImage = document.getElementById('slide-image');
            if (mainImage) {
                document.getElementById('fullscreen-img').src = mainImage.src;
                document.getElementById('fullscreen-overlay').classList.add('active');
            }
        }
        function closeFullscreen() {
            document.getElementById('fullscreen-overlay').classList.remove('active');
        }

        // --- اللعبة (Quiz) ---
        function openQuiz() {
            document.getElementById('quiz-overlay').classList.add('active');
            currentQuestionIndex = 0;
            team1Score = 0;
            team2Score = 0;
            currentTeam = 1;
            updateScoreboard();
            loadQuestion();
        }

        function closeQuiz() {
            document.getElementById('quiz-overlay').classList.remove('active');
        }

        function updateScoreboard() {
            document.getElementById('team1-score').innerText = team1Score;
            document.getElementById('team2-score').innerText = team2Score;
            document.getElementById('team1-card').classList.remove('active-team');
            document.getElementById('team2-card').classList.remove('active-team');
            if (currentTeam === 1) document.getElementById('team1-card').classList.add('active-team');
            else document.getElementById('team2-card').classList.add('active-team');
        }

        function loadQuestion() {
            isAnsweredCorrectly = false; // تصفير الحالة عند تحميل سؤال جديد
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('feedback-text').className = 'feedback-text';
            document.getElementById('feedback-text').innerText = '';
            
            if (currentQuestionIndex >= quizData.length) {
                document.getElementById('question-text').innerHTML = "🎉 Game Over! 🎉<br><span style='font-size:24px; color:var(--text-muted)'>Click 'Exit' to return.</span>";
                document.getElementById('options-container').innerHTML = '';
                document.getElementById('team1-card').classList.remove('active-team');
                document.getElementById('team2-card').classList.remove('active-team');
                return;
            }

            const q = quizData[currentQuestionIndex];
            document.getElementById('question-text').innerText = q.question;
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            const letters = ['A', 'B', 'C', 'D'];

            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                // إزالة كلاسات التحديد عشان نبدأ على نظافة
                btn.classList.remove('correct', 'wrong', 'disabled');
                
                btn.innerHTML = `
                    <div class="option-content">
                        <div class="letter">${letters[index]}</div> 
                        <span>${opt}</span>
                    </div>
                    <i class="fa-solid fa-circle-check status-icon check-icon"></i>
                    <i class="fa-solid fa-circle-xmark status-icon cross-icon"></i>
                `;
                btn.onclick = () => checkAnswer(index, btn);
                optionsContainer.appendChild(btn);
            });
        }

        // الدالة المعدلة (لما يختار غلط ميقولوش الصح)
        function checkAnswer(selectedIndex, btn) {
            if (isAnsweredCorrectly) return; // لو حد جاوب صح خلاص مينفعش يدوس تاني

            const q = quizData[currentQuestionIndex];
            const feedback = document.getElementById('feedback-text');

            if (selectedIndex === q.correctAnswer) {
                // الإجابة صح
                isAnsweredCorrectly = true;
                btn.classList.add('correct');
                playSound('correct');
                fireConfetti();

                feedback.innerText = "Correct! +1 Point";
                feedback.style.color = "var(--success)";
                feedback.classList.add('show');
                
                if (currentTeam === 1) team1Score += 1;
                else team2Score += 1;
                
                // قفل كل الأزرار التانية
                document.querySelectorAll('.option-btn').forEach(b => {
                    if(!b.classList.contains('correct')) b.classList.add('disabled');
                });

                updateScoreboard();
                document.getElementById('next-btn').style.display = 'inline-block';
                
            } else {
                // الإجابة غلط
                btn.classList.add('wrong'); // يحولها حمرا ويقفلها عشان ميتدوسش تاني
                playSound('wrong');
                
                feedback.innerText = "Oops! Wrong. Try again.";
                feedback.style.color = "var(--danger)";
                feedback.classList.add('show');
                
                // مش بنعمل حاجة للأزرار التانية، سايبينها شغالة عشان يجرب تاني
                // ومش بنظهر زرار Next
            }
        }

        function nextQuestion() {
            currentQuestionIndex++;
            currentTeam = currentTeam === 1 ? 2 : 1;
            updateScoreboard(); 
            loadQuestion();
        }

        // دالة الزينة
        function fireConfetti() {
            var duration = 2 * 1000; 
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 10000 };

            confetti({
                particleCount: 100, spread: 80, origin: { y: 0.6 }, zIndex: 10000,
                colors: ['#1e60d2', '#f59e0b', '#10b981', '#ef4444', '#8b5cf6']
            });

            var interval = setInterval(function() {
                var timeLeft = animationEnd - Date.now();
                if (timeLeft <= 0) return clearInterval(interval);
                var particleCount = 40 * (timeLeft / duration);
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: 0.1, y: Math.random() - 0.2 } }));
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: 0.9, y: Math.random() - 0.2 } }));
            }, 250);
        }

        function playSound(type) {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                const ctx = new AudioContext();
                if (type === 'correct') {
                    const notes = [523.25, 659.25, 783.99, 1046.50]; 
                    notes.forEach((freq, index) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'triangle'; 
                        osc.frequency.value = freq;
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        const startTime = ctx.currentTime + (index * 0.1);
                        gain.gain.setValueAtTime(0, startTime);
                        gain.gain.linearRampToValueAtTime(0.3, startTime + 0.05);
                        gain.gain.exponentialRampToValueAtTime(0.01, startTime + 0.4);
                        osc.start(startTime);
                        osc.stop(startTime + 0.5);
                    });
                } else {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(150, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.15);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.3);
                }
            } catch (e) { }
        }

        // --- الإعدادات ---
        function openSettings() {
            renderSettingsList();
            document.getElementById('settings-modal').style.display = 'flex';
        }
        function closeSettings() { document.getElementById('settings-modal').style.display = 'none'; }

        function renderSettingsList() {
            const list = document.getElementById('settings-list');
            list.innerHTML = '';
            studentsData.forEach((student, index) => {
                const item = document.createElement('div');
                item.style = "display: flex; justify-content: space-between; padding: 10px; background: var(--gray-bg); border-radius: 8px; margin-bottom: 8px;";
                item.innerHTML = `
                    <span style="font-weight: 600;">${index + 1}. ${student.name}</span>
                    <div style="display: flex; gap: 5px;">
                        <button onclick="moveStudent(${index}, 'up')" ${index === 0 ? 'disabled' : ''} style="border:none; background:none; color:var(--blue-primary); cursor:pointer;"><i class="fa-solid fa-arrow-up"></i></button>
                        <button onclick="moveStudent(${index}, 'down')" ${index === studentsData.length - 1 ? 'disabled' : ''} style="border:none; background:none; color:var(--blue-primary); cursor:pointer;"><i class="fa-solid fa-arrow-down"></i></button>
                        <button onclick="deleteStudent(${student.id})" style="border:none; background:none; color:var(--danger); cursor:pointer;"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `;
                list.appendChild(item);
            });
        }

        function moveStudent(index, direction) {
            if (direction === 'up' && index > 0) {
                [studentsData[index - 1], studentsData[index]] = [studentsData[index], studentsData[index - 1]];
            } else if (direction === 'down' && index < studentsData.length - 1) {
                [studentsData[index + 1], studentsData[index]] = [studentsData[index], studentsData[index + 1]];
            }
            renderSettingsList(); renderNav(); 
        }

        function deleteStudent(id) {
            if (confirm("Are you sure you want to remove this student?")) {
                studentsData = studentsData.filter(s => s.id !== id);
                renderSettingsList(); renderNav(); 
            }
        }

        window.onload = () => { renderNav(); };
    </script>
</body>
</html>
